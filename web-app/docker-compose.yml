include:
  # Optionale App-eigene Sidecar-Services (z.B. Redis, Worker).
  # Wird ignoriert wenn die Datei nicht existiert (einfache Apps ohne Sidecars).
  - path: ./app/docker-compose.services.yml
    required: false

services:
  web-app-{{APP_NAME}}:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: web-app-{{APP_NAME}}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - proxy_network
      - app_internal

networks:
  proxy_network:
    external: true
  app_internal:
    name: web-app-{{APP_NAME}}_internal
