services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_TAG:-17.8.1-ce.0}
    restart: always
    hostname: ${GITLAB_HOSTNAME:-gitlab.example.com}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Externe URL (HTTPS via Reverse Proxy)
        external_url 'https://${GITLAB_HOSTNAME:-gitlab.example.com}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

        # PostgreSQL (integriert)
        postgresql['shared_buffers'] = "256MB"

        # Redis (integriert)
        redis['maxmemory'] = "128mb"

        # Puma Worker (RAM sparen auf kleinen Servern)
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}

        # Sidekiq
        sidekiq['concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-10}

        # Container Registry deaktivieren (nicht benötigt)
        registry['enable'] = false

        # Monitoring (optional)
        prometheus_monitoring['enable'] = ${GITLAB_PROMETHEUS:-false}
        grafana['enable'] = false

        # SMTP Konfiguration
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = '${SMTP_HOST:-smtp.example.com}'
        gitlab_rails['smtp_port'] = ${SMTP_PORT:-587}
        gitlab_rails['smtp_user_name'] = '${SMTP_USERNAME}'
        gitlab_rails['smtp_password'] = '${SMTP_PASSWORD}'
        gitlab_rails['smtp_domain'] = '${SMTP_DOMAIN:-example.com}'
        gitlab_rails['smtp_authentication'] = 'login'
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['gitlab_email_from'] = '${GITLAB_EMAIL_FROM:-gitlab@example.com}'
        gitlab_rails['gitlab_email_reply_to'] = '${GITLAB_EMAIL_REPLY_TO:-noreply@example.com}'

        # SSH Port
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # Backup
        gitlab_rails['backup_keep_time'] = 604800
    volumes:
      - config:/etc/gitlab
      - logs:/var/log/gitlab
      - data:/var/opt/gitlab
    expose:
      - "80"
    ports:
      - "${GITLAB_SSH_PORT:-2222}:22"
    shm_size: '256m'
    networks:
      - gitlab_internal
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/readiness"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

volumes:
  config:
    driver: local
  logs:
    driver: local
  data:
    driver: local

networks:
  gitlab_internal:
    driver: bridge
  proxy_network:
    external: true
